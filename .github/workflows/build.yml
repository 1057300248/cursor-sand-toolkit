name: build-cursor-sand-toolkit

on:
  workflow_dispatch: {}
  push:
    branches:
      - "refactor/engineering-v1.6.0"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            artifact: cursor-sand-toolkit-macos-arm64
          - os: windows-latest
            artifact: cursor-sand-toolkit-windows-amd64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test dependencies
        run: python -m pip install pyinstaller -e .[dev]

      - name: Run regression tests
        run: python -m pytest

      - name: Build single-file binary
        run: >-
          pyinstaller --onefile --collect-submodules cursor_sand_core
          --name cursor-sand-toolkit cursor-sand-toolkit.py

      - name: Smoke-test packaged binary
        run: >-
          python -c "import os, subprocess;
          p='dist/cursor-sand-toolkit.exe' if os.name == 'nt' else 'dist/cursor-sand-toolkit';
          subprocess.run([p, '--version'], check=True)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/cursor-sand-toolkit
            dist/cursor-sand-toolkit.exe
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/refactor/engineering-v1.6.0'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts and checksums
        run: |
          set -e
          cd artifacts
          for d in */; do
            name="${d%/}"
            (cd "$d" && zip -r "../${name}.zip" .)
          done
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.6.0-engineering' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.6.0 Engineering Preview' }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          generate_release_notes: true
