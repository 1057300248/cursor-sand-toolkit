name: quality

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: python -m pip install -e .[dev]
      - name: Ruff
        run: python -m ruff check cursor_sand_core tests
      - name: Compile package including compatibility runtime
        run: python -m compileall -q cursor_sand_core
      - name: Unified CLI smoke test
        run: cursor-sand-toolkit --version
      - name: Module entrypoint smoke test
        run: python -m cursor_sand_core --version
      - name: Doctor CLI smoke test
        run: cursor-sand-doctor --help

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: python -m pip install -e .[dev]
      - name: Pytest
        run: python -m pytest
