[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-sand-toolkit"
version = "1.6.0"
description = "Cursor Sand Toolkit with modular diagnostics, build profiles and compatibility runtime."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cursor-sand-toolkit = "cursor_sand_core.cli:entrypoint"
cursor-sand-doctor = "cursor_sand_core.doctor_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["cursor_sand_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["cursor_sand_core/legacy_runtime.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
