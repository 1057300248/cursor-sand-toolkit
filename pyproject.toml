[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor-sand-toolkit-core"
version = "1.6.0.dev0"
description = "Engineering core for version profiles, patch orchestration, diagnostics and transactional file updates."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cursor-sand-doctor = "cursor_sand_core.doctor_cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.9",
]

[tool.setuptools.packages.find]
include = ["cursor_sand_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
